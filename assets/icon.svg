<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Guide U アイコン（ベクター再現版。実PNGがあれば icon.png を上書きしてください） -->
  <rect width="512" height="512" rx="112" fill="#22766B"/>

  <!-- U 外側ライン -->
  <path d="M150 248 v118 a106 106 0 0 0 212 0 v-56" fill="none" stroke="#fff" stroke-width="36"/>
  <!-- U 内側ライン -->
  <path d="M210 248 v114 a46 46 0 0 0 92 0 v-62" fill="none" stroke="#fff" stroke-width="28"/>
  <!-- 内側ライン右の小フック -->
  <path d="M311 300 h18 v30" fill="none" stroke="#fff" stroke-width="16"/>

  <!-- 矢印（外側ライン先端・右上向き） -->
  <g transform="rotate(40 366 288)">
    <polygon points="326,296 406,296 366,220" fill="#fff"/>
  </g>

  <!-- ブリム（中央がVに下がる） -->
  <path d="M166 168 L346 168 L346 232 Q298 252 256 294 Q214 252 166 232 Z" fill="#fff" stroke="#22766B" stroke-width="11"/>

  <!-- 角帽（白塗り・フラットなダイヤ） -->
  <polygon points="256,62 422,132 256,202 90,132" fill="#fff" stroke="#22766B" stroke-width="9"/>

  <!-- タッセル -->
  <rect x="84" y="142" width="14" height="62" rx="6" fill="#fff"/>
  <path d="M91 202 l15 24 a15 15 0 1 1 -30 0 Z" fill="#fff"/>
</svg>
